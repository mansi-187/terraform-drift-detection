name: Terraform Drift Detection

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tf-drift-dev
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TF_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend-config=backend-${TF_ENV}.hcl

      - name: Plan (detect drift)
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -lock-timeout=60s \
            -var-file=${TF_ENV}.tfvars -out=tfplan | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          exit 0

      - name: Auto-remediate
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan

      - name: Open GitHub issue on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Drift detected in dev';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'drift'
            });
            if (!open.data.find(i => i.title === title)) {
              await github.rest.issues.create({
                ...context.repo, title, labels: ['drift'],
                body: `Drift found and auto-remediated.\n[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            }

      - name: Close issue when clean
        if: steps.plan.outputs.exitcode == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Drift detected in dev';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'drift'
            });
            for (const i of open.data.filter(i => i.title === title)) {
              await github.rest.issues.update({
                ...context.repo, issue_number: i.number, state: 'closed'
              });
            }

      - name: Slack notification
        if: steps.plan.outputs.exitcode == '2' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"Drift detected and auto-remediated in dev"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
